name: Skill Regression

on:
  pull_request:
    paths:
      - "skills/entrix/**"
      - "scripts/skill_regression.sh"
      - "tests/test_skill_regression_fixtures.py"
      - "tests/fixtures/skill_regression/**"
      - ".github/workflows/skill-regression.yml"
      - "README.md"
      - "harness.yaml"
  push:
    branches:
      - main
    paths:
      - "skills/entrix/**"
      - "scripts/skill_regression.sh"
      - "tests/test_skill_regression_fixtures.py"
      - "tests/fixtures/skill_regression/**"
      - ".github/workflows/skill-regression.yml"
      - "README.md"
      - "harness.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Entrix and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run fixture regression tests
        run: pytest tests/test_skill_regression_fixtures.py

      - name: Run fixture harness smoke
        run: bash scripts/skill_regression.sh --fixtures
