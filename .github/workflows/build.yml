name: Build and Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            extension: .exe
            data_separator: ";"
          - os: ubuntu-latest
            target: linux-amd64
            extension: ""
            data_separator: ":"
          - os: ubuntu-24.04-arm
            target: linux-arm64
            extension: ""
            data_separator: ":"
          - os: macos-15-intel
            target: macos-amd64
            extension: ""
            data_separator: ":"
          - os: macos-14
            target: macos-arm64
            extension: ""
            data_separator: ":"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Read package version
        id: version
        shell: bash
        run: |
          echo "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Install binary dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
          pip install pyinstaller

      - name: Build standalone binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pyinstaller --onefile \
            --name "entrix-${VERSION}-${{ matrix.target }}" \
            --add-data "entrix${{ matrix.data_separator }}entrix" \
            --collect-all fastmcp \
            --collect-all tree_sitter_language_pack \
            --hidden-import yaml \
            --hidden-import tree_sitter \
            entrix/cli.py
          binary="entrix-${VERSION}-${{ matrix.target }}${{ matrix.extension }}"
          test -f "dist/$binary"
          "dist/$binary" --help

      - name: Smoke test release launcher
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary="entrix-${VERSION}-${{ matrix.target }}${{ matrix.extension }}"
          python scripts/release_launcher_smoke.py \
            --launcher bin/entrix-bootstrap.${{ matrix.target == 'windows-amd64' && 'ps1' || 'sh' }} \
            --binary "dist/$binary" \
            --version "$VERSION" \
            --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          binary="entrix-${VERSION}-${{ matrix.target }}${{ matrix.extension }}"
          mkdir -p release
          cp "dist/$binary" "release/$binary"
          if [ "${{ matrix.target }}" = "windows-amd64" ]; then
            python -c "import zipfile; z=zipfile.ZipFile('release/entrix-${VERSION}-${{ matrix.target }}.zip', 'w', zipfile.ZIP_DEFLATED); z.write('release/${binary}', arcname='${binary}'); z.close()"
          else
            tar -czf "release/entrix-${VERSION}-${{ matrix.target }}.tar.gz" -C release "$binary"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: entrix-${{ matrix.target }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read package version
        id: version
        shell: bash
        run: |
          echo "version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT_NAME" in
            release)
              tag="$EVENT_RELEASE_TAG"
              ;;
            push)
              tag="$REF_NAME"
              ;;
            workflow_dispatch)
              git fetch --tags --force
              tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
              if [[ -z "$tag" ]]; then
                echo "Manual release runs require an existing tag reachable from HEAD" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ -z "$tag" || "$tag" != v* ]]; then
            echo "Release tag must be a non-empty v* tag, got: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import json
          import sys
          import tomllib
          from pathlib import Path

          release_tag = sys.argv[1]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          plugin = json.loads(Path(".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          marketplace = json.loads(Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))

          if release_tag != f"v{version}":
              raise SystemExit(f"release tag {release_tag} does not match package version {version}")
          if plugin["version"] != version:
              raise SystemExit("plugin.json version does not match pyproject.toml")
          entry = marketplace["plugins"][0]
          if entry["version"] != version:
              raise SystemExit("marketplace.json version does not match pyproject.toml")
          if entry["release"]["asset_prefix"] != f"entrix-{version}-":
              raise SystemExit("marketplace asset prefix does not match pyproject.toml")
          print(f"release {release_tag} is aligned with version {version}")
          PY

      - name: Download platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: entrix-*
          path: release
          merge-multiple: true

      - name: Generate checksums and release manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: https://github.com/${{ github.repository }}
          RELEASE_SIGNING_KEY: ${{ secrets.ENTRIX_RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || {
            echo "ENTRIX_RELEASE_SIGNING_KEY secret is required for signed releases" >&2
            exit 1
          }
          umask 077
          signing_key="$RUNNER_TEMP/entrix-release-signing.key"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$signing_key"
          python scripts/build_release_assets.py \
            --version "$VERSION" \
            --repository "$REPOSITORY" \
            --input-dir release \
            --output release/release-manifest.json \
            --signing-key "$signing_key"
          rm -f "$signing_key"
          find release -name '*.sha256' -type f -print

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          overwrite_files: true
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-python-package:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          pip install build
          pip install -e .

      - name: Build Python packages
        run: python -m build

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/
          retention-days: 7
