version: "harness/v1"
settings:
  failure_mode: closed

fitness:
  dimensions:
    - dimension: code_quality
      weight: 35
      threshold: {pass: 100, warn: 90}
      metrics:
        - name: ruff_pass
          command: ruff check . 2>&1
          hard_gate: true
          tier: fast
          description: Ruff must pass with no lint errors.
        - name: no_new_debug_prints
          command: python scripts/check_new_debug_prints.py 2>&1
          pattern: "new_debug_prints: 0"
          tier: fast
          description: Production code should not grow accidental debug prints.
        - name: file_budget_pass
          command: python -m entrix analyze long-file --config file_budgets.json --json 2>&1
          pattern: '"status": "ok"'
          tier: fast
          execution_scope: ci
          hard_gate: true
          description: Python sources must stay within file_budgets.json line budgets.
    - dimension: testability
      weight: 40
      threshold: {pass: 100, warn: 90}
      metrics:
        - name: pytest_pass
          command: pytest 2>&1
          hard_gate: true
          tier: normal
          description: The repository test suite must pass.
    - dimension: release_readiness
      weight: 25
      threshold: {pass: 100, warn: 90}
      metrics:
        - name: cli_help_smoke
          command: python -m entrix --help 2>&1
          pattern: "usage: entrix"
          hard_gate: true
          tier: fast
          description: The local package entrypoint must still render CLI help.
        - name: package_build_pass
          command: python -m build --no-isolation 2>&1
          hard_gate: false
          tier: normal
          execution_scope: ci
          description: The project must still produce source and wheel distributions.
review_triggers:
  rules:
    - name: core_engine_change
      type: changed_paths
      paths: [entrix/cli.py, entrix/engine.py, entrix/governance.py, entrix/review_trigger.py, entrix/presets/**]
      severity: high
      action: require_human_review
    - name: packaging_or_workflow_change
      type: changed_paths
      paths: [pyproject.toml, .github/workflows/**, harness.yaml]
      severity: medium
      action: require_human_review
    - name: sensitive_release_files
      type: sensitive_file_change
      paths: [pyproject.toml, entrix/model.py, entrix/review_trigger.py]
      severity: high
      action: require_human_review
    - name: cross_boundary_engine_test_docs_change
      type: cross_boundary_change
      boundaries:
        engine: [entrix/**]
        tests: [tests/**]
        docs: [docs/**]
      min_boundaries: 2
      severity: medium
      action: require_human_review
    - name: oversized_change
      type: diff_size
      max_files: 10
      max_added_lines: 400
      max_deleted_lines: 250
      severity: medium
      action: require_human_review

evidence_producers:
  - id: fitness
    type: fitness
    name: Entrix Fitness
    builtin: entrix-fitness
  - id: review-trigger
    type: review-trigger
    name: Review Trigger
    builtin: entrix-review-trigger
  - id: diff-stats
    type: diff
    name: Git Diff Statistics
    builtin: diff-stats

gate_policies:
  - name: Fitness must pass
    severity: hard
    rule:
      evidence_id: fitness
      condition: status == "pass"
  - name: Review trigger warning
    severity: soft
    rule:
      evidence_id: review-trigger
      condition: status == "fail"
