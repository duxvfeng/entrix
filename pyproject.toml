[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entrix"
version = "0.1.21"
description = "A Harness Engineering tool for turning quality rules, architecture constraints, and validation steps into executable guardrails."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Phodal" },
]
keywords = ["fitness-functions", "architecture", "quality-gates", "code-review", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0,<7",
    "tree-sitter-language-pack>=0.13,<1",
]

[project.urls]
Homepage = "https://gitee.com/duxvfeng/entrix"
Repository = "https://gitee.com/duxvfeng/entrix.git"
Issues = "https://gitee.com/duxvfeng/entrix/issues"

[project.optional-dependencies]
graph = [
    "code-review-graph>=1.8,<2",
]
mcp = [
    "fastmcp>=0.1.0,<2",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.10,<2",
    "pytest>=8.0,<9",
    "ruff>=0.3.0,<1",
    "types-PyYAML>=6.0.12,<7",
]
visual = [
    "rich>=13.0,<14",
]

[project.scripts]
entrix = "entrix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["entrix"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/multi_agent_system"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --basetemp=.pytest-sandbox"
norecursedirs = ["tests/fixtures", ".pytest_*", ".pytest-*"]
markers = [
    "integration: marks tests as integration tests (slow, may require external tools)",
]

[tool.mypy]
python_version = "3.11"
files = [
    "entrix/harness/config.py",
    "entrix/harness/engine.py",
    "entrix/harness/gate",
    "entrix/harness/producers",
    "entrix/stop_gate/hook.py",
    "entrix/stop_gate/runner.py",
    "entrix/runners/shell.py",
]
exclude = ["docs/multi_agent_system"]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
